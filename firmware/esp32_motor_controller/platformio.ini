; NeuroGrip ESP32 motor controller.
;
;   pio run                 build
;   pio run -t upload       flash
;   pio device monitor      watch the log stream
;
; The host talks NGP v1 over USB-CDC at 921600 baud. See docs/protocol.md.

[env:esp32-s3-devkitc-1]
platform = espressif32@^6.5.0
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 921600
upload_speed = 921600

build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D CORE_DEBUG_LEVEL=1
    -O2
    -Wall
    -Wextra

lib_deps =
    madhephaestus/ESP32Servo@^1.1.1

; Reference target. The controller also builds for a plain ESP32 dev board;
; the S3 is preferred for its second USB peripheral and larger SRAM.
[env:esp32dev]
platform = espressif32@^6.5.0
board = esp32dev
framework = arduino
monitor_speed = 921600
build_flags = -D CORE_DEBUG_LEVEL=1 -O2 -Wall
lib_deps = madhephaestus/ESP32Servo@^1.1.1
