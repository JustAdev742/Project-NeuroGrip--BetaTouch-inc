[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "prosthetic-hand-prototype"
version = "1.0.0"
description = "AI-assisted prosthetic hand prototype — school showcase inspired by DeGol et al. (EMBC 2016)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Student Team"},
]
keywords = ["prosthetic", "emg", "computer-vision", "robotics", "raspberry-pi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Programming Language :: Python :: 3",
]

dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "numpy>=1.26.0",
    "opencv-python>=4.10.0",
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
vision = ["ultralytics>=8.2.0"]
hardware = ["adafruit-circuitpython-ads1x15>=2.2.20", "RPi.GPIO>=0.7.1"]
dev = ["pytest>=8.2.0", "ruff>=0.4.0"]

[project.scripts]
prosthetic-hand = "app.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
