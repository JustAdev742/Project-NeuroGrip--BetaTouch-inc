## Hardware profile — the reference NeuroGrip build.
##
##   neurogrip run --config config/hardware.toml
##
## Reference platform (see docs/hardware.md):
##   host    Raspberry Pi 4B / CM4, 64-bit Linux
##   motors  5 × metal-gear micro servo, tendon-driven
##   control BBC micro:bit v2 + edge breakout + PCA9685 servo driver
##   EMG     2-channel differential front end → ADS1256 → USB CDC
##   camera  Pi Camera Module 3 (or any V4L2 device)
##   display 800×480 capacitive touchscreen
##
## For the ESP32 controller instead — which adds current sensing, and with it
## contact detection, adaptive grip force and tendon calibration — see the
## commented block below.

[hardware]
simulate = false

[servo]
driver = "microbit"
port = "/dev/serial/by-id/usb-ARM_BBC_micro:bit_CMSIS-DAP-if01"
baud = 115200
required = true
# Looser than the ESP32 needs: MicroPython streams state at 25 Hz.
watchdog_ms = 400
state_timeout_s = 0.5
# "auto" detects a PCA9685 on I2C and falls back to direct pins.
driver_board = "auto"

# Tuned for the reference actuators. Raising these is a mechanical decision, not
# a software one — see docs/hardware.md before changing them.
#
# Lower than the ESP32 build allows: with no current sensing nothing notices a
# finger driving into a hard stop, so the mechanism has to survive it unaided.
max_velocity = 1.2
max_acceleration = 4.0
max_current_ma = 900
max_temperature_c = 65.0
max_force = 0.85

[emg]
driver = "serial"
port = "/dev/serial/by-id/usb-BetaTouch_EMG_Frontend-if00"
baud = 460800
required = true
sample_rate_hz = 1000.0
adc_reference_v = 5.0
adc_bits = 24
amplifier_gain = 1000.0
# Set to 60.0 in the Americas and parts of Asia.
mains_hz = 50.0

[camera]
enabled = true
driver = "opencv"
device = 0
width = 640
height = 480
fps = 30.0
fov_deg = 66.0
required = false

[vision]
enabled = true
backend = "hggd_mcu"

[vision.hggd_mcu]
model_path = "models/hggd_mcu/hggd_mcu_int8.onnx"
# Two threads leaves headroom for the 200 Hz control loop on a quad-core Pi.
threads = 2

[ui]
renderer = "tk"
width = 800
height = 480
fullscreen = true
theme = "dark"

[runtime]
control_hz = 200.0
emg_hz = 200.0
decision_hz = 100.0
vision_hz = 20.0
ui_hz = 15.0
diagnostics_hz = 2.0

[logging]
level = "INFO"
file = "var/logs/neurogrip.jsonl"

[telemetry]
blackbox = true

# ---------------------------------------------------------------------------
# ESP32 controller — uncomment this block and comment out [servo] above.
#
# Adds per-finger current sensing, and with it contact detection, adaptive grip
# force, stall detection and tendon-slack calibration. Everything above the HAL
# is unchanged; only these settings and the flashed firmware differ.
#
# [servo]
# driver = "esp32"
# port = "/dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit-if00"
# baud = 921600
# required = true
# watchdog_ms = 250
# state_timeout_s = 0.2
# max_velocity = 2.0
# max_acceleration = 8.0
# max_current_ma = 900
# max_temperature_c = 65.0
# max_force = 0.85
#
# [control]
# max_velocity = 1.8
# max_acceleration = 7.0
