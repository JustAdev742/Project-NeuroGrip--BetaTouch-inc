name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # The runtime core is standard-library only, so this installs test tools
      # and nothing else. That the full stack runs without third-party
      # dependencies is a property worth protecting, so CI does not install the
      # optional extras.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Types
        run: mypy src
        continue-on-error: true

      - name: Unit tests
        run: pytest tests/unit -q

      - name: Integration tests
        run: pytest tests/integration -q

      # The shared-control invariants, run separately so a failure here is
      # unmistakable in the log. If these break, the system has stopped being a
      # shared-control device.
      - name: Shared-control invariants
        run: |
          pytest -q \
            "tests/unit/test_fusion_and_safety.py::TestTheAiNeverActsAlone" \
            "tests/unit/test_fusion_and_safety.py::TestAssistanceDegradesToControlNeverToInaction" \
            "tests/integration/test_system.py::TestSharedControlInvariants"

      - name: Scenarios
        run: PYTHONPATH=src python -m neurogrip simulate all --log-level ERROR

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PlatformIO
        run: pip install platformio
      - name: Build firmware
        working-directory: firmware/esp32_motor_controller
        run: pio run -e esp32-s3-devkitc-1
