# ─────────────────────────────────────────────────────────────
# Grip mappings — detected object label → GripType
# ─────────────────────────────────────────────────────────────
# These map the grip-relevant labels (from COCO_GRIP_MAP in
# yolo_detector.py) to actual GripType enum values.
#
# When YOLOv8 detects a "cup" → COCO_GRIP_MAP maps it to "power"
# → this config maps "power" to GripType.POWER.
#
# You can also add custom object labels from fine-tuned models.
# ─────────────────────────────────────────────────────────────

grip_mapping:
  # Grip labels (from COCO_GRIP_MAP)
  pinch: PINCH
  power: POWER
  cylindrical: CYLINDRICAL
  tripod: TRIPOD
  hook: HOOK
  typing: PINCH

  # Direct COCO names (if they bypass the grip map)
  pen: PINCH
  key: PINCH
  card: PINCH
  ball: POWER
  cup: CYLINDRICAL
  mug: HOOK
  tool: HOOK
  handle: HOOK
  box: POWER
  book: POWER
  marble: TRIPOD
  nut: TRIPOD
  empty_palm: OPEN

  # Common COCO objects detected by YOLOv8n
  bottle: CYLINDRICAL
  cell phone: PINCH
  remote: PINCH
  scissors: PINCH
  fork: PINCH
  knife: PINCH
  spoon: PINCH
  banana: POWER
  apple: TRIPOD
  orange: TRIPOD
  sports ball: POWER
  tennis racket: POWER
  baseball bat: POWER
  keyboard: PINCH
  laptop: PINCH
  umbrella: CYLINDRICAL
  handbag: HOOK
  suitcase: HOOK
  backpack: HOOK
  vase: CYLINDRICAL
  clock: PINCH
