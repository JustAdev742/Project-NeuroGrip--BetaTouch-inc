# ─────────────────────────────────────────────────────────────
# Vision configuration — YOLOv8n on Raspberry Pi CPU
# ─────────────────────────────────────────────────────────────
# Model: YOLOv8n (nano) — auto-downloaded if not present
#   - ~6 MB model, ~8-12 FPS on Pi 4 CPU at 320px
#   - Pretrained on COCO (80 classes) — common objects work out of the box
#   - Fine-tune with auto-training captures for custom objects
#
# COCO classes are auto-mapped to grip types via COCO_GRIP_MAP
# in yolo_detector.py — no manual label list needed for pretrained model.
# ─────────────────────────────────────────────────────────────

vision:
  backend: "yolo"
  model_path: "assets/models/yolov8n.pt"
  device: "cpu"
  confidence_threshold: 0.30
  iou_threshold: 0.45
  input_size: 320

  # Custom labels — only needed if you fine-tune on your own dataset.
  # Leave empty to use COCO class names with auto grip mapping.
  labels: []
